name: Security Lab CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate documentation, scripts, and sample evidence
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip
          if grep -Eq '^[A-Za-z0-9_.-]' requirements.txt; then
            pip install -r requirements.txt
          else
            echo "No external Python dependencies to install."
          fi

      - name: Validate Python syntax
        run: python scripts/validate_python_syntax.py .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate Markdown formatting
        run: python scripts/validate_markdown.py .

      - name: Run basic secret scan
        run: python scripts/secret_scan.py .

      - name: Parse firewall logs
        run: python scripts/parse_firewall_logs.py --json

      - name: Summarize IDS and Windows events
        run: python scripts/summarize_security_events.py --json

      - name: Regenerate lab inventory
        run: python scripts/generate_lab_inventory.py
